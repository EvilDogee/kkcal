private enum FoodVisionAnalyzer {
    static func analyze(_ image: UIImage) async -> FoodItem {
        guard let cgImage = image.cgImage else { return fallback }

        return await withCheckedContinuation { continuation in
            let request = VNClassifyImageRequest { request, _ in
                let observations =
                    request.results as? [VNClassificationObservation] ?? []
                let best = observations.first { $0.confidence > 0.12 }

                continuation.resume(
                    returning: best.map(makeFood) ?? fallback
                )
            }

            // VNClassifyImageRequest не поддерживает
            // imageCropAndScaleOption — эту настройку не добавляем.
            DispatchQueue.global(qos: .userInitiated).async {
                try? VNImageRequestHandler(cgImage: cgImage).perform([request])
            }
        }
    }

    private static func makeFood(
        _ observation: VNClassificationObservation
    ) -> FoodItem {
        let label = observation.identifier.lowercased()

        let map: [(String, String, Int, String, Color)] = [
            ("pizza", "Пицца", 285, "fork.knife", .orange),
            ("salad", "Овощной салат", 180, "leaf.fill", .green),
            ("burger", "Бургер", 520, "takeoutbag.and.cup.and.straw.fill", .orange),
            ("sandwich", "Сэндвич", 350, "takeoutbag.and.cup.and.straw.fill", .brown),
            ("sushi", "Суши", 310, "fish.fill", .pink),
            ("soup", "Суп", 220, "cup.and.saucer.fill", .orange),
            ("pasta", "Паста", 430, "fork.knife", .yellow),
            ("cake", "Десерт", 390, "birthday.cake.fill", .pink),
            ("apple", "Яблоко", 95, "apple.logo", .red),
            ("banana", "Банан", 105, "carrot.fill", .yellow),
            ("bread", "Хлеб", 250, "birthday.cake.fill", .brown),
            ("chicken", "Курица", 330, "fork.knife", .orange),
            ("fish", "Рыба", 290, "fish.fill", .cyan),
            ("rice", "Рис", 210, "takeoutbag.and.cup.and.straw.fill", .brown),
            ("egg", "Яйцо", 155, "oval.fill", .yellow),
            ("coffee", "Кофе", 45, "cup.and.saucer.fill", .brown)
        ]

        if let match = map.first(where: { label.contains($0.0) }) {
            return FoodItem(
                name: match.1,
                detail: "Порция · оценка ИИ",
                calories: match.2,
                symbol: match.3,
                tint: match.4
            )
        }

        let title = observation.identifier
            .replacingOccurrences(of: "_", with: " ")
            .capitalized

        return FoodItem(
            name: title,
            detail: "Порция · оценка ИИ",
            calories: 280,
            symbol: "fork.knife",
            tint: .green
        )
    }

    private static let fallback = FoodItem(
        name: "Блюдо",
        detail: "Порция · оценка ИИ",
        calories: 300,
        symbol: "fork.knife",
        tint: .green
    )
}
