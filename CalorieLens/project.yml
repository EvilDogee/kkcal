name: CalorieLens
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  CalorieLens:
    type: application
    platform: iOS
    sources:
      - path: CalorieLens
    info:
      path: CalorieLens/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CalorieLens
        PRODUCT_NAME: CalorieLens
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
